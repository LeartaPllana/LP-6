<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page 6</title>
    <link
      rel="shortcut icon"
      href="./assets/images/appy-logo.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./assets/css/style.css">
    
</head>
<body>
    <!-- Nav Bar -->
    <div class="wrapper">
        <nav class="nav">
            <div class="nav-logo">
               <img src="./assets/images/appy-logo.png" alt="Appy Logo">
            </div>
            <div class="nav-menu" id="navMenu">
                <ul>
                    <li><a href="#" class="link">Products <img src="./assets/icons/chevron-down.svg" alt="Dropdown arrow"></a></li>
                    <li><a href="#" class="link">Business Solutions <img src="./assets/icons/chevron-down.svg" alt="Dropdown arrow"></a></li> 
                    <li><a href="#" class="link">Help Center <img src="./assets/icons/chevron-down.svg" alt="Dropdown arrow"></a></li> 
                    <li><a href="#" class="link">Pricing <img src="./assets/icons/chevron-down.svg" alt="Dropdown arrow"></a></li> 
                </ul>
            </div>
            <div class="nav-button">
                <button class="btn white-btn" id="loginBtn" onclick="login()">Log In</button>
                <button class="btn blue-btn" id="getStartedBtn" onclick="getStarted()">Get Started</button>
            </div>
            <div class="nav-menu-btn">
                <img src="./assets/icons/menu-icon.svg" alt="Menu icon responive" onclick="myMenuFunction()"></img>
            </div>
        </nav>
        </div>
        <!-- Hero Section -->
        <div class="container">
            <div class="text-section">
                <h1>Building apps just got easier</h1>
                <p>
                  Aliquam vel platea curabitur sit vestibulum egestas sit id lorem. Aliquet neque, dui sed eget scelerisque. Non at et venenatis tortor amet feugiat ullamcorper in.
                </p>
                <div class="buttons">
                  <button class="btn-primary">Get Started</button>
                  <button class="btn-secondary"><img src="./assets/icons/play.svg" alt="play video icon"> Watch Video</button>
                </div>
              </div>
            <div class="image-section">
              <img src="./assets/images/home-image.png" alt="Phone Illustration">
            </div>
            
          </div>
        <script src="./assets/js/main.js"></script>
</body>
</html>
